<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kayson Fakhar</title>
  <script>
    // Single-page app on GitHub Pages: deep links like /cv land here.
    // Stash the requested path and bounce to the app, which restores it.
    try { sessionStorage.setItem("kf-redirect", location.pathname + location.search + location.hash); } catch (e) {}
    location.replace("/");
  </script>
</head>
<body></body>
</html>
