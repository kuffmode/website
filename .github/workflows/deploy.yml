name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate blog index
        run: python generate_blog_index.py
        working-directory: site

      - name: Commit updated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/content/blog-posts.json
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping."
          else
            git commit -m "chore: update blog index [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Shapley interactive
        run: |
          cp -a site "$RUNNER_TEMP/pages-site"
          npm ci --prefix site/shapley
          npm run build --prefix site/shapley -- --outDir "$RUNNER_TEMP/pages-site/shapley" --emptyOutDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
